<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>everything in its right place</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;color:#e8e6e3;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  main{position:relative;height:100vh;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;object-fit:contain;background:#0a0a0a}
  .meta{position:fixed;left:24px;bottom:20px;font-size:12px;letter-spacing:.04em;color:#e8e6e3;opacity:.85;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .meta small{display:block;color:#8a8885;margin-top:4px}
  .note{position:fixed;right:24px;bottom:20px;font-size:11px;color:#8a8885;text-align:right;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  a{color:#e8e6e3}
</style>
</head>
<body>
<main>
  <video id="v" controls playsinline preload="metadata"
         src="4-video_final.mp4"></video>
  <div class="meta">everything in its right place<small>radiohead · kid a · a montage of the new machines</small></div>
  <div class="note">silent by design — the track is yours to add<br><a href="https://gofile.io/d/t09Foodj">download 1080p full quality</a></div>
</main>
<script>
  // spacebar toggles play, like a proper edit bay
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); const v = document.getElementById('v'); v.paused ? v.play() : v.pause(); }
  });
</script>
</body>
</html>
